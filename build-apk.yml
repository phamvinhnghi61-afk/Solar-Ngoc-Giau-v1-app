name: Build Solar Ngoc Giau PRO APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add Android platform & sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Enable Wi-Fi, Bluetooth & Notification Permissions in AndroidManifest
        run: |
          python3 - << 'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = '''    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />'''
          if 'POST_NOTIFICATIONS' not in s:
              s = s.replace('<application', perms + '\n    <application', 1)
              open(p, 'w').write(s)
          PY

      - name: Add Native Anti-Tamper Signature Bridge in MainActivity
        run: |
          python3 - << 'PY'
          import glob, os
          files = glob.glob('android/app/src/main/java/**/MainActivity.java', recursive=True)
          if files:
              p = files[0]
              s = open(p).read()
              if 'SolarSecurity' not in s:
                  helper = '''import android.os.Bundle;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.Signature;
          import android.os.Build;
          import android.provider.Settings;
          import android.webkit.JavascriptInterface;
          import java.security.MessageDigest;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public String getSecurityInfo() {
                              JSONObject obj = new JSONObject();
                              try {
                                  String pkg = getPackageName();
                                  obj.put("packageId", pkg);
                                  String aid = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                                  obj.put("deviceId", aid != null ? aid : "");
                                  obj.put("deviceModel", Build.MANUFACTURER + " " + Build.MODEL + " (Android " + Build.VERSION.RELEASE + ")");
                                  String inst = getPackageManager().getInstallerPackageName(pkg);
                                  obj.put("installer", inst != null ? inst : "direct");
                                  PackageInfo pi = Build.VERSION.SDK_INT >= 28
                                      ? getPackageManager().getPackageInfo(pkg, PackageManager.GET_SIGNING_CERTIFICATES)
                                      : getPackageManager().getPackageInfo(pkg, PackageManager.GET_SIGNATURES);
                                  Signature[] sigs = Build.VERSION.SDK_INT >= 28
                                      ? pi.signingInfo.getApkContentsSigners()
                                      : pi.signatures;
                                  if (sigs != null && sigs.length > 0) {
                                      byte[] digest = MessageDigest.getInstance("SHA-256").digest(sigs[0].toByteArray());
                                      StringBuilder sb = new StringBuilder();
                                      for (int i = 0; i < digest.length; i++) {
                                          if (i > 0) sb.append(":");
                                          sb.append(String.format("%02X", digest[i]));
                                      }
                                      obj.put("sha256", sb.toString());
                                  }
                              } catch (Exception e) {}
                              return obj.toString();
                          }
                      }, "SolarSecurity");
                  }
              }
          }'''
                  pkg_line = s.splitlines()[0]
                  open(p, 'w').write(pkg_line + '\nimport com.getcapacitor.BridgeActivity;\n' + helper)
          PY

      - name: Add Google Maven Central Mirror (Avoid 429 Rate Limit)
        run: |
          python3 - << 'PY'
          p = 'android/build.gradle'
          s = open(p).read()
          mirror = "maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }\n        mavenCentral()"
          if 'maven-central.storage-download.googleapis.com' not in s:
              s = s.replace('mavenCentral()', mirror)
              open(p, 'w').write(s)
          PY

      - name: Apply Solar Ngoc Giau App Launcher Icon
        run: |
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            if [ -d "android/app/src/main/res/$dir" ]; then
              cp www/icon-192.png "android/app/src/main/res/$dir/ic_launcher.png"
              cp www/icon-192.png "android/app/src/main/res/$dir/ic_launcher_round.png"
              cp www/icon-512.png "android/app/src/main/res/$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Setup Release Keystore & Print SHA-256
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
          else
            keytool -genkeypair -v -keystore android/app/release.jks -alias solarngocgiau -keyalg RSA -keysize 2048 -validity 10000 -storepass solar123456 -keypass solar123456 -dname "CN=Solar Ngoc Giau, OU=ThapMuoi, O=SolarNgocGiau, L=DongThap, ST=DongThap, C=VN"
          fi
          keytool -list -v -keystore android/app/release.jks -alias solarngocgiau -storepass solar123456 | grep -E "SHA1:|SHA256:" || true
          python3 - << 'PY'
          p = 'android/app/build.gradle'
          s = open(p).read()
          sig = '''
          signingConfigs {
              release {
                  storeFile file('release.jks')
                  storePassword System.getenv('KEYSTORE_PASS') ?: 'solar123456'
                  keyAlias System.getenv('KEY_ALIAS') ?: 'solarngocgiau'
                  keyPassword System.getenv('KEY_PASS') ?: 'solar123456'
              }
          }
          buildTypes {'''
          if 'signingConfigs' not in s:
              s = s.replace('buildTypes {', sig, 1)
              s = s.replace('minifyEnabled false', 'minifyEnabled false\n            signingConfig signingConfigs.release', 1)
              open(p, 'w').write(s)
          PY

      - name: Build Debug APK, Signed Release APK & Play Store AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --max-workers=2 || ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --max-workers=2

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Ngoc-Giau-PRO-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
